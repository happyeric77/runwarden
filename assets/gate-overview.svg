<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="640" viewBox="0 0 1240 640" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">

  <rect x="1" y="1" width="1238" height="638" rx="18" fill="#f8fafc" stroke="#e2e8f0"/>

  <text x="165" y="52" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="2" fill="#64748b">AGENTS ACT.</text>
  <text x="620" y="52" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="2" fill="#64748b">POLICIES DECIDE.</text>
  <text x="1075" y="52" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="2" fill="#64748b">TOOLS EXECUTE.</text>

  <!-- Agent -->
  <rect x="40" y="90" width="250" height="190" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="165" y="130" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Your agent</text>
  <text x="165" y="152" text-anchor="middle" font-size="13" fill="#64748b">any model</text>
  <rect x="60" y="172" width="210" height="34" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="165" y="194" text-anchor="middle" font-size="14" fill="#3730a3" font-family="ui-monospace, Menlo, Consolas, monospace">notes__search &#215;2</text>
  <rect x="60" y="218" width="210" height="34" rx="8" fill="#fef2f2" stroke="#fecaca"/>
  <text x="165" y="240" text-anchor="middle" font-size="14" fill="#991b1b" font-family="ui-monospace, Menlo, Consolas, monospace">billing__refund</text>

  <!-- Gate -->
  <rect x="420" y="80" width="400" height="230" rx="16" fill="#0f172a"/>
  <text x="620" y="120" text-anchor="middle" font-size="22" font-weight="800" letter-spacing="3" fill="#ffffff">RUNWARDEN</text>
  <text x="620" y="142" text-anchor="middle" font-size="13" fill="#94a3b8">every proposed call is checked before it runs</text>
  <g font-size="15" fill="#e2e8f0">
    <circle cx="462" cy="166" r="9" fill="none" stroke="#4ade80" stroke-width="2"/>
    <text x="462" y="171" text-anchor="middle" font-size="11" fill="#4ade80">&#10003;</text>
    <text x="482" y="172">exactly-one call per step</text>
    <circle cx="462" cy="198" r="9" fill="none" stroke="#4ade80" stroke-width="2"/>
    <text x="462" y="203" text-anchor="middle" font-size="11" fill="#4ade80">&#10003;</text>
    <text x="482" y="204">tool allowlist</text>
    <circle cx="462" cy="230" r="9" fill="none" stroke="#4ade80" stroke-width="2"/>
    <text x="462" y="235" text-anchor="middle" font-size="11" fill="#4ade80">&#10003;</text>
    <text x="482" y="236">input validation</text>
    <circle cx="462" cy="262" r="9" fill="none" stroke="#4ade80" stroke-width="2"/>
    <text x="462" y="267" text-anchor="middle" font-size="11" fill="#4ade80">&#10003;</text>
    <text x="482" y="268">requireApproval list</text>
  </g>

  <!-- Tools -->
  <rect x="950" y="90" width="250" height="190" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="1075" y="130" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Your MCP tools</text>
  <text x="1075" y="152" text-anchor="middle" font-size="13" fill="#64748b">execution only</text>
  <rect x="970" y="172" width="210" height="34" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="1075" y="194" text-anchor="middle" font-size="14" fill="#166534" font-family="ui-monospace, Menlo, Consolas, monospace">notes__search &#10003;</text>
  <rect x="970" y="218" width="210" height="34" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="1075" y="240" text-anchor="middle" font-size="14" fill="#94a3b8" font-family="ui-monospace, Menlo, Consolas, monospace">billing__refund &#8856;</text>

  <!-- Arrows -->
  <line x1="292" y1="165" x2="405" y2="165" stroke="#334155" stroke-width="2.5"/>
  <polygon points="420,165 405,158.5 405,171.5" fill="#334155"/>
  <text x="354" y="150" text-anchor="middle" font-size="13" fill="#334155">proposes</text>

  <line x1="822" y1="150" x2="935" y2="150" stroke="#16a34a" stroke-width="2.5"/>
  <polygon points="950,150 935,143.5 935,156.5" fill="#16a34a"/>
  <text x="884" y="135" text-anchor="middle" font-size="13" fill="#16a34a">allowed</text>

  <line x1="822" y1="212" x2="866" y2="212" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6 4"/>
  <polygon points="885,196 901,204 901,220 885,228 869,220 869,204" fill="#dc2626"/>
  <text x="885" y="218" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">!</text>
  <text x="884" y="248" text-anchor="middle" font-size="12" fill="#b91c1c">approval-gated</text>
  <text x="884" y="264" text-anchor="middle" font-size="12" fill="#b91c1c">stopped</text>

  <path d="M 470 312 L 470 350 Q 470 364 456 364 L 178 364 Q 164 364 164 350 L 164 297" fill="none" stroke="#d97706" stroke-width="2.5"/>
  <polygon points="164,282 157.5,297 170.5,297" fill="#d97706"/>
  <text x="318" y="388" text-anchor="middle" font-size="13" fill="#b45309">denied &#8594; correction issued, model retries</text>

  <line x1="620" y1="312" x2="620" y2="405" stroke="#334155" stroke-width="2.5"/>
  <polygon points="620,420 613.5,405 626.5,405" fill="#334155"/>
  <text x="634" y="362" font-size="13" fill="#334155">every ruling</text>
  <path d="M 1075 282 L 1075 396 Q 1075 410 1061 410 L 774 410 Q 760 410 760 424 L 760 422" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4"/>
  <polygon points="760,437 753.5,422 766.5,422" fill="#94a3b8"/>
  <text x="1010" y="400" font-size="13" fill="#64748b">every execution</text>

  <!-- Postgres -->
  <path d="M 470 446 L 470 528 A 150 24 0 0 0 770 528 L 770 446" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <ellipse cx="620" cy="446" rx="150" ry="24" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="620" y="480" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">Postgres remembers.</text>
  <text x="620" y="501" text-anchor="middle" font-size="12.5" fill="#334155" font-family="ui-monospace, Menlo, Consolas, monospace">invocations &#183; policy_decisions</text>
  <text x="620" y="519" text-anchor="middle" font-size="12.5" fill="#334155" font-family="ui-monospace, Menlo, Consolas, monospace">tool_call_audits &#183; worker_leases</text>

  <text x="620" y="606" text-anchor="middle" font-size="13" font-style="italic" fill="#64748b">Your database, your workers, your audit trail. No hosted control plane.</text>
</svg>
